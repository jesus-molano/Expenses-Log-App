name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Tests unitarios (UTC)
        run: npm test
        env:
          TZ: UTC
      # Canarias va una hora por detrás de la Península: destapa errores de
      # fechas que en UTC no se ven.
      - name: Tests unitarios (Atlantic/Canary)
        run: npm test
        env:
          TZ: Atlantic/Canary

  e2e:
    name: Build y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E
        run: npx playwright test
        env:
          E2E_SKIP_BUILD: "1"
      - name: E2E sin conexión (arranque en frío)
        run: npm run e2e:offline
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
